name: Android APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Test, lint, and build debug APK
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK and lint report
        uses: actions/upload-artifact@v4
        with:
          name: R-Installation-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/lint-results-debug.html
          if-no-files-found: error
          retention-days: 14

      - name: Build unsigned release APK
        if: github.event_name != 'pull_request'
        run: ./gradlew --no-daemon assembleRelease

      - name: Decode release signing key
        if: github.event_name != 'pull_request'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.ANDROID_SIGNING_KEY_BASE64 }}
        run: |
          test -n "$SIGNING_KEY_BASE64"
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

      - name: Sign and verify release APK
        if: github.event_name != 'pull_request'
        id: release
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
        run: |
          test -n "$SIGNING_STORE_PASSWORD"
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          version_name="$(sed -n 's/^[[:space:]]*versionName "\(.*\)"/\1/p' app/build.gradle)"
          test -n "$version_name"
          apk_name="R-Installation-v${version_name}.apk"
          output_dir="$RUNNER_TEMP/release"
          build_tools="$ANDROID_HOME/build-tools/36.0.0"
          mkdir -p "$output_dir"
          "$build_tools/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$output_dir/app-release-aligned.apk"
          "$build_tools/apksigner" sign \
            --ks "$RUNNER_TEMP/release-key.jks" \
            --ks-key-alias "$SIGNING_KEY_ALIAS" \
            --ks-pass env:SIGNING_STORE_PASSWORD \
            --key-pass env:SIGNING_KEY_PASSWORD \
            --out "$output_dir/$apk_name" \
            "$output_dir/app-release-aligned.apk"
          "$build_tools/zipalign" -c -v 4 "$output_dir/$apk_name"
          "$build_tools/apksigner" verify --verbose --print-certs "$output_dir/$apk_name"
          sha256sum "$output_dir/$apk_name" > "$output_dir/$apk_name.sha256"
          echo "apk_name=$apk_name" >> "$GITHUB_OUTPUT"
          echo "output_dir=$output_dir" >> "$GITHUB_OUTPUT"

      - name: Upload signed release artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: R-Installation-signed-${{ github.sha }}
          path: |
            ${{ steps.release.outputs.output_dir }}/${{ steps.release.outputs.apk_name }}
            ${{ steps.release.outputs.output_dir }}/${{ steps.release.outputs.apk_name }}.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to tagged GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          APK_NAME: ${{ steps.release.outputs.apk_name }}
          OUTPUT_DIR: ${{ steps.release.outputs.output_dir }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 ||
            gh release create "$GITHUB_REF_NAME" --target "$GITHUB_SHA" --generate-notes
          gh release upload "$GITHUB_REF_NAME" \
            "$OUTPUT_DIR/$APK_NAME" \
            "$OUTPUT_DIR/$APK_NAME.sha256" \
            --clobber
